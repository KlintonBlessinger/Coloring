<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f4efe6" />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="A cozy color-by-number book you can play offline. No ads, no accounts." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Color Cozy" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />
    <title>Color Cozy</title>
  </head>
  <body>
    <div class="haptic-host" aria-hidden="true">
      <input id="haptic-switch" type="checkbox" switch tabindex="-1" aria-hidden="true" />
      <label id="haptic-tick" for="haptic-switch"></label>
    </div>
    <div id="app"></div>
    <noscript>Color Cozy needs JavaScript to play.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
